AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Inference-time customization on Amazon Bedrock AgentCore Gateway: one
  interceptor Lambda serving both phases, running a configurable chain of
  plugins (tenant, max_tokens, router, model policy, budget, guardrail,
  metering). The chain lives in SSM Parameter Store and changes without a
  deploy. Everything here is disposable; delete the stack to remove it.

Parameters:
  StackPrefix:
    Type: String
    Default: gwpipeline
    AllowedPattern: "^[a-zA-Z0-9]{1,24}$"
    Description: Alphanumeric only; AgentCore gateway and target names disallow hyphens.
  StrongModel:
    Type: String
    Default: mistral.mistral-large-3-675b-instruct
  WeakModel:
    Type: String
    Default: mistral.ministral-3-3b-instruct
  DailyBudgetUsd:
    Type: Number
    Default: 1
    Description: Default per-tenant daily spend limit enforced by the budget plugin.
  LogRetentionDays:
    Type: Number
    Default: 14
  CacheBackend:
    Type: String
    Default: dynamodb
    AllowedValues: [dynamodb, valkey]
    Description: >
      dynamodb keeps the interceptor outside any VPC. valkey adds a private VPC,
      an ElastiCache Serverless (Valkey) cache and interface endpoints for the
      services the interceptor calls, so it needs no NAT gateway.

  InterceptorEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set false to measure the bare gateway hop with no interceptor attached.

  AuthMode:
    Type: String
    Default: iam
    AllowedValues: [iam, jwt]
    Description: >
      iam signs requests with SigV4. jwt stands up a Cognito user pool with two
      machine-to-machine clients and puts the gateway behind a CUSTOM_JWT
      authorizer, so the tenant comes from a validated token instead of a header.

Conditions:
  WithInterceptor: !Equals [!Ref InterceptorEnabled, "true"]
  WithJwt: !Equals [!Ref AuthMode, jwt]
  WithValkey: !Equals [!Ref CacheBackend, valkey]

Resources:

  # ---------- State: spend ledger and request/response correlation ----------
  StateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${StackPrefix}-state"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        # `tenant` is not part of the table's key -- it is the vector index's
        # HASH search-schema element, and those must be declared here too.
        - { AttributeName: tenant, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      # Only items that carry `embedding` are indexed, so the spend ledger and
      # the cached answers share this table without being searched. TTL removes
      # an item from the index along with the item.
      VectorIndexes:
        - IndexName: semantic-cache
          VectorAttribute:
            AttributeName: embedding
          Dimensions: 256
          DistanceFunction: COSINE
          SearchSchema:
            - { AttributeName: tenant, SearchSchemaElementType: HASH }
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes: [cache_key, prompt]

  # ---------- Guardrail used by the guardrail plugin ----------
  Guardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub "${StackPrefix}-input"
      Description: Screens prompts before any model is called.
      BlockedInputMessaging: "This request was blocked by the gateway's content policy."
      BlockedOutputsMessaging: "The response was blocked by the gateway's content policy."
      ContentPolicyConfig:
        FiltersConfig:
          - { Type: HATE, InputStrength: MEDIUM, OutputStrength: NONE }
          - { Type: VIOLENCE, InputStrength: MEDIUM, OutputStrength: NONE }
          - { Type: MISCONDUCT, InputStrength: MEDIUM, OutputStrength: NONE }
          # Strength sets the lowest confidence that blocks. HIGH blocked "Reply
          # with the single word: ok." as a LOW-confidence prompt attack; MEDIUM
          # still blocks a real injection, which scores HIGH confidence.
          - { Type: PROMPT_ATTACK, InputStrength: MEDIUM, OutputStrength: NONE }
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - { Type: US_SOCIAL_SECURITY_NUMBER, Action: BLOCK }
          - { Type: CREDIT_DEBIT_CARD_NUMBER, Action: BLOCK }

  GuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt Guardrail.GuardrailId
      Description: Pinned version the pipeline references (v2 - PROMPT_ATTACK at MEDIUM).

  # ---------- The plugin chain, editable at runtime ----------
  PipelineConfig:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/${StackPrefix}/pipeline"
      Type: String
      Description: Ordered plugin chain. Edit to add, remove or reorder plugins; picked up within CONFIG_TTL seconds.
      Value: !Sub |
        {
          "fail_open": true,
          "plugins": [
            {"plugin": "tenant", "params": {"header": "x-tenant-id", "default": "anonymous"}},
            {"plugin": "max_tokens", "params": {"default": 1024}},
            {"plugin": "cache", "params": {"ttl_s": 3600}},
            {"plugin": "router", "params": {"strategy": "length", "threshold": 2000,
                                            "strong": "${StrongModel}", "weak": "${WeakModel}"}},
            {"plugin": "model_policy", "params": {"allow": {"*": ["*"]}}},
            {"plugin": "budget", "params": {"daily_usd": {"*": ${DailyBudgetUsd}}}},
            {"plugin": "guardrail", "params": {"guardrail_id": "${Guardrail.GuardrailId}",
                                               "version": "${GuardrailVersion.Version}"}},
            {"plugin": "metering", "params": {}},
            {"plugin": "escalate", "params": {"strong": "${StrongModel}", "verbose_tokens": 400}}
          ]
        }


  # ---------- Private network, only when the cache is ElastiCache ----------
  #
  # No NAT gateway: every service the interceptor calls has a VPC endpoint, so
  # the subnets stay private and egress-free. DynamoDB uses a gateway endpoint,
  # which costs nothing.
  Vpc:
    Condition: WithValkey
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${StackPrefix}-vpc" }]

  SubnetA:
    Condition: WithValkey
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
  SubnetB:
    Condition: WithValkey
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]

  RouteTable:
    Condition: WithValkey
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  RouteA:
    Condition: WithValkey
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref RouteTable, SubnetId: !Ref SubnetA }
  RouteB:
    Condition: WithValkey
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref RouteTable, SubnetId: !Ref SubnetB }

  LambdaSg:
    Condition: WithValkey
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Interceptor Lambda
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        # 443 to anywhere looks broad and is not: the subnets have no NAT and no
        # internet gateway, so the only reachable destinations are the interface
        # endpoints and the DynamoDB gateway endpoint. Scoping this to the VPC
        # CIDR silently breaks DynamoDB, whose gateway endpoint routes to public
        # AWS ranges through a prefix list rather than to an address in the VPC.
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: VPC and gateway endpoints }
        - { IpProtocol: tcp, FromPort: 6379, ToPort: 6379, CidrIp: 10.20.0.0/16, Description: Valkey }

  CacheSg:
    Condition: WithValkey
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ElastiCache Serverless
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 6379, ToPort: 6379, SourceSecurityGroupId: !Ref LambdaSg }

  EndpointSg:
    Condition: WithValkey
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Interface VPC endpoints
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref LambdaSg }

  DynamoEndpoint:
    Condition: WithValkey
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref RouteTable]

  MantleEndpoint:
    Condition: WithValkey
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.bedrock-mantle"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref EndpointSg]

  BedrockRuntimeEndpoint:
    Condition: WithValkey
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.bedrock-runtime"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref EndpointSg]

  SsmEndpoint:
    Condition: WithValkey
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.ssm"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref EndpointSg]

  LogsEndpoint:
    Condition: WithValkey
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.logs"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref EndpointSg]

  ValkeyCache:
    Condition: WithValkey
    Type: AWS::ElastiCache::ServerlessCache
    Properties:
      ServerlessCacheName: !Sub "${StackPrefix}-valkey"
      Engine: valkey
      Description: Response cache for the gateway interceptor
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]
      SecurityGroupIds: [!Ref CacheSg]

  # ---------- Interceptor ----------
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !If [WithValkey, arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole, !Ref AWS::NoValue]
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${StackPrefix}/pipeline"
              - Effect: Allow   # TransactWriteItems is authorized per item action
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt StateTable.Arn
              - Effect: Allow   # semantic cache: recall candidates, then verify
                # The index ARN alone is enough -- SearchVectors authorizes
                # against the index, not the table it hangs off.
                Action: [dynamodb:SearchVectors]
                Resource: !Sub "${StateTable.Arn}/index/semantic-cache"
              - Effect: Allow
                # A cross-region inference profile (the `us.` prefix) routes to
                # foundation models in every region it spans, and authorizes
                # against the model ARN in the region it lands on -- so the
                # model grant cannot be pinned to this stack's region.
                Action: bedrock:InvokeModel
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/*"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
              - Effect: Allow   # the pii plugin's default detector
                Action: [comprehend:DetectPiiEntities]
                Resource: "*"
              - Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource: !GetAtt Guardrail.GuardrailArn
              - Effect: Allow   # the escalate plugin calls the strong model itself
                Action: bedrock-mantle:CreateInference
                Resource: !Sub "arn:aws:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:project/*"
              - Effect: Allow
                Action: [bedrock-mantle:Get*, bedrock-mantle:List*]
                Resource: "*"
              - Effect: Allow   # only the `learned` router strategy uses this
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"

  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${StackPrefix}-interceptor"
      RetentionInDays: !Ref LogRetentionDays

  PipelineFunction:
    Type: AWS::Lambda::Function
    DependsOn: PipelineLogGroup
    Properties:
      FunctionName: !Sub "${StackPrefix}-interceptor"
      Runtime: python3.13
      Architectures: [arm64]
      Handler: gateway.handler.lambda_handler
      Role: !GetAtt PipelineRole.Arn
      Timeout: 60   # an escalation calls the strong model from inside the response phase
      MemorySize: 512
      # `make pipeline-up` assembles this directory and uploads it with `aws cloudformation package`.
      Code: ../.build/pipeline/
      VpcConfig: !If
        - WithValkey
        - SubnetIds: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroupIds: [!Ref LambdaSg]
        - !Ref AWS::NoValue
      Environment:
        Variables:
          CACHE_BACKEND: !Ref CacheBackend
          VALKEY_ENDPOINT: !If [WithValkey, !GetAtt ValkeyCache.Endpoint.Address, ""]
          PIPELINE_CONFIG_PARAM: !Ref PipelineConfig
          STATE_TABLE: !Ref StateTable
          VECTOR_INDEX: semantic-cache
          JWT_ISSUER: !If
            - WithJwt
            - !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
            - ""
          METRIC_NAMESPACE: !Sub "${StackPrefix}/Pipeline"
          CONFIG_TTL: "30"

  PipelineInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PipelineFunction.Arn
      Action: lambda:InvokeFunction
      Principal: bedrock-agentcore.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # ---------- Gateway ----------
  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: mantle-inference
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock-mantle:CreateInference
                Resource: !Sub "arn:aws:bedrock-mantle:${AWS::Region}:${AWS::AccountId}:project/*"
              - Effect: Allow
                Action: [bedrock-mantle:Get*, bedrock-mantle:List*]
                Resource: "*"
        - PolicyName: invoke-interceptor
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt PipelineFunction.Arn

  Gateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: !Ref StackPrefix
      RoleArn: !GetAtt GatewayRole.Arn
      AuthorizerType: AWS_IAM
      Description: Inference gateway with a plugin-pipeline interceptor
      InterceptorConfigurations: !If
        - WithInterceptor
        - - InterceptionPoints: [REQUEST, RESPONSE]
            Interceptor:
              Lambda:
                Arn: !GetAtt PipelineFunction.Arn
            InputConfiguration:
              # The tenant plugin reads a header. The interceptor then sees every
              # header, Authorization included, so it must never log them.
              PassRequestHeaders: true
        - !Ref AWS::NoValue


  # ---------- Identity: one issuer, one client per tenant (AuthMode=jwt) ----------
  #
  # Cognito's client-credentials flow is the machine-to-machine case: each
  # tenant gets an app client, and the token it mints names that client. The
  # gateway validates the token before the interceptor is invoked; the
  # jwt_tenant plugin reads the tenant out of it.

  UserPool:
    Type: AWS::Cognito::UserPool
    Condition: WithJwt
    Properties:
      UserPoolName: !Sub "${StackPrefix}-tenants"
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Condition: WithJwt
    Properties:
      Domain: !Sub "${StackPrefix}-${AWS::AccountId}"
      UserPoolId: !Ref UserPool

  ResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Condition: WithJwt
    Properties:
      UserPoolId: !Ref UserPool
      Identifier: gw
      Name: inference-gateway
      # A scope per tenant. Machine-to-machine tokens carry no custom claims,
      # so the scope is where tenancy lives: `gw/tenant-acme`.
      Scopes:
        - { ScopeName: tenant-acme, ScopeDescription: Act as tenant acme }
        - { ScopeName: tenant-globex, ScopeDescription: Act as tenant globex }

  TenantAcmeClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: WithJwt
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${StackPrefix}-acme"
      GenerateSecret: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: ["gw/tenant-acme"]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]

  TenantGlobexClient:
    Type: AWS::Cognito::UserPoolClient
    Condition: WithJwt
    DependsOn: ResourceServer
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub "${StackPrefix}-globex"
      GenerateSecret: true
      AllowedOAuthFlows: [client_credentials]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: ["gw/tenant-globex"]
      ExplicitAuthFlows: [ALLOW_REFRESH_TOKEN_AUTH]

  MantleTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !Ref Gateway
      Name: mantle
      Description: Bedrock OpenAI-compatible endpoint (all models behind one target)
      TargetConfiguration:
        Inference:
          Connector:
            Source:
              ConnectorId: bedrock-mantle
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE


  # ---------- A second gateway, behind the token issuer (AuthMode=jwt) ----------
  #
  # The authorizer type cannot be changed on an existing gateway -- the service
  # refuses the update outright -- so IAM and JWT are two gateways, not one
  # gateway with a setting. They share the interceptor, the state table and the
  # guardrail; only the front door differs, which is what makes them comparable.

  JwtGateway:
    Type: AWS::BedrockAgentCore::Gateway
    Condition: WithJwt
    Properties:
      Name: !Sub "${StackPrefix}jwt"
      RoleArn: !GetAtt GatewayRole.Arn
      AuthorizerType: CUSTOM_JWT
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}/.well-known/openid-configuration"
          AllowedClients:
            - !Ref TenantAcmeClient
            - !Ref TenantGlobexClient
      Description: Inference gateway authorized by a Cognito-issued token
      InterceptorConfigurations: !If
        - WithInterceptor
        - - InterceptionPoints: [REQUEST, RESPONSE]
            Interceptor:
              Lambda:
                Arn: !GetAtt PipelineFunction.Arn
            InputConfiguration:
              PassRequestHeaders: true
        - !Ref AWS::NoValue

  JwtMantleTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Condition: WithJwt
    Properties:
      GatewayIdentifier: !Ref JwtGateway
      Name: mantle
      Description: Bedrock OpenAI-compatible endpoint
      TargetConfiguration:
        Inference:
          Connector:
            Source:
              ConnectorId: bedrock-mantle
      CredentialProviderConfigurations:
        - CredentialProviderType: GATEWAY_IAM_ROLE

Outputs:
  TokenUrl:
    Condition: WithJwt
    Description: OAuth2 token endpoint for the client-credentials flow
    Value: !Sub "https://${StackPrefix}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/oauth2/token"
  JwtIssuer:
    Condition: WithJwt
    Value: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
  TenantAcmeClientId:
    Condition: WithJwt
    Value: !Ref TenantAcmeClient
  TenantGlobexClientId:
    Condition: WithJwt
    Value: !Ref TenantGlobexClient
  JwtGatewayUrl:
    Condition: WithJwt
    Description: Same pipeline, token-authorized; clients append /inference/v1/chat/completions
    Value: !GetAtt JwtGateway.GatewayUrl
  GatewayUrl:
    Description: Base URL; clients append /inference/v1/chat/completions
    Value: !GetAtt Gateway.GatewayUrl
  GatewayIdentifier:
    Value: !Ref Gateway
  InterceptorFunction:
    Value: !Ref PipelineFunction
  PipelineConfigParameter:
    Value: !Ref PipelineConfig
  StateTable:
    Value: !Ref StateTable
  GuardrailId:
    Value: !GetAtt Guardrail.GuardrailId
  GuardrailVersion:
    Value: !GetAtt GuardrailVersion.Version
  MetricNamespace:
    Value: !Sub "${StackPrefix}/Pipeline"
  CacheBackend:
    Value: !Ref CacheBackend
  ValkeyEndpoint:
    Condition: WithValkey
    Value: !GetAtt ValkeyCache.Endpoint.Address
